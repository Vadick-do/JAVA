name: booking-coursework

services:
  app:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - HTTP_HOST
      - HTTP_PORT
    ports:
      - "127.0.0.1:${HTTP_HOST_PORT:-8080}:${HTTP_CONTAINER_PORT:-8080}"
    volumes:
      - type: bind
        source: ${CONFIG_FILE:-./application.properties}
        target: /app/application.properties
        read_only: true
        bind:
          create_host_path: false
    command: ["--config", "/app/application.properties"]

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-booking_coursework}
      POSTGRES_USER: ${DB_USER:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  socat:
    image: alpine/socat:1.8.1.3
    depends_on:
      postgres:
        condition: service_healthy
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"

  test:
    profiles: [test]
    build:
      context: .
      target: build
    command: ["mvn", "-B", "-ntp", "-o", "test"]

volumes:
  postgres-data:
